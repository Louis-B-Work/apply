<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Finance 247 - apply form redesign prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6905F2; --green:#00D4B5; --ink:#000; --btn-ink:#111;
  --grey:#8C8C8C; --grey-text:#4B5563; --line:#E5E7EB;
  --err:#D92D20; --ok:#0E9F6E;
  --tint:rgba(105,5,242,.05); --tint-hover:rgba(105,5,242,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,sans-serif;font-size:16px;line-height:24px;color:var(--ink);background:#fff}
button,input{font-family:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1em;height:1em;fill:currentColor;flex:none}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

/* shell */
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding-top:20px}
.logo svg{display:block;width:70.15px;height:60px;fill:var(--purple)}
.tp{display:block;width:156px;color:#000;text-decoration:none}
.tp .l svg{display:block;width:100%;aspect-ratio:126/31;fill:#000}
.tp .s svg{display:block;width:100%;aspect-ratio:512/96;margin-top:4px}
.tp .i{font-size:10px;line-height:14px;margin-top:4px;white-space:nowrap}
.tp .i b{font-weight:700}
.tp .i .dv{margin:0 4px;color:#6B7280}
.progress{display:flex;align-items:center;height:32px;margin:16px 0 42px}
.pstep{position:relative;flex:none;width:32px;height:32px}
.pnum{display:grid;place-items:center;box-sizing:border-box;width:32px;height:32px;border-radius:50%;border:2px solid #E5E7EB;background:#F3F4F6;color:#6B7280;font-size:14px;line-height:1;font-weight:700}
.pline{flex:1 1 0;min-width:0;height:3px;margin:0 8px;border-radius:2px;background:var(--line);overflow:hidden}
.pline i{display:block;height:100%;width:0;background:var(--green)}
.pstep.on .pnum{background:var(--green);border-color:var(--green);color:#111}
.pstep.now .pnum{box-shadow:0 0 0 4px rgba(0,212,181,.3)}
.pstep.end .pnum{background:#fff;border-color:var(--purple);color:var(--purple)}
.plabel{position:absolute;top:39px;font-size:12px;line-height:16px;font-weight:500;color:#9CA3AF;white-space:nowrap}
.plabel.first{left:0}
.plabel.mid{left:50%;transform:translateX(-50%)}
.plabel.last{right:0}
.pstep.done .plabel{color:#4B5563}
.pstep.now .plabel{color:#111;font-weight:700}
/* classic: the original plain bar (6px grey track, green fill) with a small orb marking where you are */
.progress.classic{display:block;position:relative;height:6px;margin:20px 0 14px;background:var(--line)}
.progress.classic .cfill{display:block;height:100%;width:0;background:var(--green)}
.progress.classic .orb{position:absolute;top:50%;left:0;box-sizing:border-box;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:3px solid var(--green);box-shadow:0 0 0 4px rgba(0,212,181,.3)}
main{padding-bottom:48px}
.back{display:inline-flex;align-items:center;gap:4px;margin:12px 0 20px;color:#000;font-size:18px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.back .ic{width:24px;height:24px;margin-left:-6px}
h1{font-size:30px;line-height:37.5px;font-weight:700;margin:0 0 16px}
.sub{margin:0 0 24px}
.hint-lg{margin:0 0 16px;color:var(--grey-text)}

/* form primitives */
.field{margin-bottom:20px}
.field>label,.lbl{display:block;font-weight:700;font-size:16px;line-height:24px;margin-bottom:6px}
.hint{display:block;color:var(--grey-text);font-size:14px;line-height:20px;margin:-2px 0 8px}
.control{position:relative}
.input{width:100%;height:56px;border:1px solid var(--grey);border-radius:6px;padding:0 16px;font-size:18px;color:#000;background:#fff;-webkit-appearance:none;appearance:none}
.input::placeholder{color:#9CA3AF}
.input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 2px var(--purple)}
.input.err{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.input.err:focus{box-shadow:0 0 0 2px var(--err)}
.input[readonly]{background:#F9FAFB}
.error{display:flex;gap:6px;align-items:flex-start;color:var(--err);font-size:14px;line-height:20px;font-weight:500;margin-top:8px}
.error .ic{width:16px;height:16px;margin-top:2px}
.okmsg{display:flex;gap:6px;align-items:center;color:#0B7A55;font-size:14px;line-height:20px;font-weight:500;margin-top:8px}
.okmsg .ic{width:18px;height:18px}
.suggest{font-size:14px;line-height:20px;margin-top:8px}
.link{background:none;border:0;padding:0;font-size:inherit;font-weight:500;color:#000;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:6px;background:var(--green);color:var(--btn-ink);font-size:18px;font-weight:700;cursor:pointer}
.btn .ic{width:16px;height:16px}
.btn:hover{filter:brightness(.96)}
.btn.secondary{background:#fff;border:2px solid var(--green)}
.btn[disabled]{background:var(--line);color:#6B7280;cursor:not-allowed;filter:none}
.btn:focus-visible{outline:3px solid #000;outline-offset:2px}
.spinner{width:20px;height:20px;border:3px solid rgba(17,17,17,.2);border-top-color:#111;border-radius:50%;animation:sp .8s linear infinite;flex:none}
.control .spinner{position:absolute;right:16px;top:18px;width:20px;height:20px;border-color:rgba(105,5,242,.2);border-top-color:var(--purple)}
@keyframes sp{to{transform:rotate(360deg)}}
.legal{font-size:14px;line-height:20px;margin:16px 0 0}
.legal a{font-weight:700;color:#000;text-decoration:underline;text-underline-offset:3px}

/* step 1 address */
.why{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;margin:-4px 0 20px;font-size:16px;font-weight:500;color:#000;cursor:pointer}
.why .ic{width:20px;height:20px;margin-left:-4px;transition:transform .15s}
.why[aria-expanded=true] .ic{transform:rotate(90deg)}
.why span{text-decoration:underline;text-underline-offset:3px}
.why-panel{margin:-8px 0 20px 22px;color:var(--grey-text);font-size:16px}
.count{margin:20px 0 12px;font-weight:700}
.filter .input{padding-left:46px;font-size:16px}
.filter .ic{position:absolute;left:14px;top:16px;width:24px;height:24px;color:#6B7280}
.lbwrap{position:relative;margin-top:12px}
.lbwrap::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:36px;background:linear-gradient(rgba(255,255,255,0),#fff);border-radius:0 0 8px 8px;pointer-events:none}
.lbwrap.at-end::after{display:none}
.lb{max-height:272px;overflow:auto;border:1px solid var(--grey);border-radius:8px;background:#fff;outline:none;overscroll-behavior:contain}
.lb:focus-visible{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple)}
.grp{position:sticky;top:0;z-index:1;background:#F3EEFE;border-bottom:1px solid var(--line);padding:8px 16px;font-size:14px;line-height:20px;font-weight:700}
.opt{display:flex;align-items:center;min-height:52px;padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.opt:hover{background:var(--tint)}
.opt[aria-selected=true]{background:var(--tint-hover);box-shadow:inset 3px 0 0 var(--purple)}
.lb>[role=group]:last-child .opt:last-child{border-bottom:0}
mark{background:rgba(105,5,242,.12);color:inherit;font-weight:700;border-radius:2px}
.nomatch{margin:12px 0 0;color:var(--grey-text)}
.manual{display:inline-block;margin:16px 0 24px;font-size:16px}
.card{background:var(--tint);border:.8px solid var(--purple);border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:24px}
.card .pin{width:24px;height:24px;color:var(--purple);margin-top:2px}
.card .adr{flex:1;font-weight:500}
.card .adr b{font-weight:700}
.card .link{flex:none}
.confirm-sub{margin:0 0 12px;font-size:18px;line-height:26px;font-weight:700}
.lbwrap.paged::after{display:none}
.lbwrap.paged .lb{max-height:none;overflow:visible}
.lb>.opt:last-child{border-bottom:0}
.more{margin:16px 0 24px}
.cant{margin:16px 0 24px}
.more+.cant{margin-top:-8px}
.moved{border:0;padding:0;margin:0 0 24px;min-width:0}
.moved legend{padding:0;margin-bottom:8px;font-weight:700;font-size:16px;line-height:24px}
.mv-row{display:flex;gap:12px}
.mv-f{flex:1;min-width:0}
.mv-f.year{flex:1.5}
.mv-f label{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--grey-text);margin-bottom:4px}
.xid{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:#EDE7FD;color:#4a05b0;font-size:11px;line-height:18px;font-weight:700;font-style:normal;vertical-align:1px}
.x-list{margin:0;padding:0;list-style:none;font-size:13px;line-height:18px}
.x-list li{margin:8px 0;padding:8px 10px;border-radius:6px;background:#F5F3FB}
.x-list i{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:4px}
.x-list i.on{background:#D6F5EC;color:#0B7A55}
.x-list i.off{background:#E5E7EB;color:#4B5563}
.x-list span{display:block;margin-top:2px;color:#374151;font-weight:400}
.switch{display:inline-block;margin:0 0 24px}

/* step 2 DOB */
.dob{border:0;margin:0;padding:0;min-width:0}
.dob-row{display:grid;grid-template-columns:1fr 56px;gap:8px;align-items:start}
.dob-row.nocal{grid-template-columns:1fr}
.dob-row.boxes .calbtn{margin-top:30px}
.bxs{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
.bx label{display:block;font-weight:700;font-size:16px;line-height:24px;margin-bottom:6px}
.seg.bxs .input{padding:0 40px 0 14px;color:#000;letter-spacing:0;caret-color:auto}
.seg.bxs .tick{right:10px;width:20px;height:20px;margin-top:-10px}
.seg .input{padding:0 16px 0 calc(50% - 4.3em);text-align:left;letter-spacing:.02em;color:transparent;caret-color:#000}
.mask{position:absolute;inset:0;display:flex;align-items:center;box-sizing:border-box;padding:0 16px 0 calc(50% - 4.3em);border:1px solid transparent;font-size:18px;letter-spacing:.02em;white-space:pre;pointer-events:none}
.mask .typed{color:#000}
.mask .rest{color:#9CA3AF}
.seg .tick{position:absolute;right:14px;top:50%;width:24px;height:24px;margin-top:-12px;display:none}
.seg.ok .tick{display:block}
.calbtn{width:56px;height:56px;border:1px solid var(--purple);border-radius:6px;background:var(--tint);color:var(--purple);display:grid;place-items:center;cursor:pointer;padding:0}
.calbtn .ic{width:28px;height:28px}
.calbtn:hover{background:var(--tint-hover)}
.dobmsg{min-height:0;margin-bottom:24px}
.dobmsg:empty{margin:0}
.dobmsg .error,.dobmsg .okmsg{margin-top:12px}
.cta-gap{margin-top:24px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:85vh;background:#fff;border-radius:16px 16px 0 0;z-index:51;display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,.2);outline:none}
.sheet:focus,.sheet:focus-visible{outline:none}
.grab{width:40px;height:4px;border-radius:2px;background:#D1D5DB;margin:8px auto 0;flex:none}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 0 20px;flex:none}
.sheet-h h2{font-size:20px;line-height:28px;font-weight:700;margin:0}
.x{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:#000;padding:0}
.x .ic{width:28px;height:28px}
.chips{display:flex;gap:8px;padding:8px 20px 12px;flex:none}
.chip{height:40px;padding:0 14px;border:1px solid var(--grey);border-radius:20px;background:#fff;font-size:16px;font-weight:500;color:#000;cursor:pointer;white-space:nowrap}
.chip[aria-current=true]{border:2px solid var(--purple);background:var(--tint);padding:0 13px}
.chip[disabled]{color:#9CA3AF;border-color:#D1D5DB;cursor:not-allowed}
.pview{position:relative;overflow:auto;padding:0 20px 28px;height:400px;flex:none}
.pgrid{display:grid;gap:8px}
.pgrid.c4{grid-template-columns:repeat(4,1fr)}
.pgrid.c3{grid-template-columns:repeat(3,1fr)}
.pgrid.c7{grid-template-columns:repeat(7,1fr);gap:4px}
.pbtn{height:48px;border:1px solid #D1D5DB;border-radius:8px;background:#fff;font-size:16px;font-weight:500;color:#000;cursor:pointer;padding:0}
.pgrid.c3 .pbtn{height:56px}
.pgrid.c7 .pbtn{height:44px;border-radius:6px}
.pbtn:hover{background:var(--tint)}
.pbtn[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#fff}
.pbtn[aria-disabled=true]{color:#9CA3AF;background:#F3F4F6;cursor:not-allowed}
.dec{grid-column:1/-1;font-size:14px;line-height:20px;font-weight:700;color:var(--grey-text);padding:12px 0 0}
.dec:first-child{padding-top:4px}
.mhead{font-weight:700;font-size:18px;margin:4px 0 8px}
.wd{font-size:13px;line-height:20px;font-weight:700;color:var(--grey-text);text-align:center}
.sfoot{padding:12px 20px 20px;border-top:1px solid var(--line);flex:none}

/* step 3 contact */
.assure{list-style:none;margin:8px 0 24px;padding:16px;background:var(--tint);border:.8px solid var(--purple);border-radius:8px;display:grid;gap:16px}
.assure li{display:flex;gap:12px;align-items:flex-start}
.assure .ico{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid rgba(105,5,242,.3);display:grid;place-items:center;color:var(--purple)}
.assure .ico .ic{width:16px;height:16px}
.assure .ico .ic.lg{width:22px;height:22px}
.assure strong{display:block;font-weight:700;font-size:16px;line-height:22px}
.assure .t{display:block;font-size:14px;line-height:20px;color:var(--grey-text);margin-top:2px}
.lblrow{position:relative;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lblrow label{display:block;font-weight:700;font-size:16px;line-height:24px}
.tip{display:inline-flex}
.tipbtn{position:relative;width:22px;height:22px;padding:0;border-radius:50%;border:1.5px solid var(--purple);background:#fff;color:var(--purple);font-size:13px;line-height:1;font-weight:700;cursor:pointer;display:grid;place-items:center}
.tipbtn::before{content:"";position:absolute;inset:-11px}   /* 44px tap area around the 22px circle */
.tipbtn:hover,.tipbtn[aria-expanded=true]{background:var(--purple);color:#fff}
.tipbox{pointer-events:none;position:absolute;left:0;bottom:calc(100% + 12px);z-index:20;width:min(320px,100%);box-sizing:border-box;padding:10px 12px;border-radius:8px;background:#111;color:#fff;font-size:14px;line-height:20px;font-weight:400;display:none}
.tipbox.show{display:block}
.tipbox::before{content:"";position:absolute;left:calc(var(--arrow,140px) - 5px);bottom:-5px;width:10px;height:10px;background:#111;transform:rotate(45deg)}
.formerr{margin:0 0 16px}
.formerr:empty{margin:0}

/* design notes: phone on the left, notes on the right (?notes=1 or the Annotations button) */
#notes{display:none}
body.notes-on{background:#F1F2F6}
body.notes-on #stage{display:flex;gap:32px;align-items:flex-start;justify-content:center;padding:24px}
body.notes-on #screen{position:relative;flex:1 1 640px;max-width:640px;min-height:calc(100vh - 152px);background:#fff;box-shadow:0 0 0 1px #D9DCE3,0 8px 24px rgba(0,0,0,.08)}
body.notes-on.shot #screen{flex:none;width:375px;min-height:812px}
#side,#summary{display:none}
body.notes-on #side{display:flex;gap:24px;align-items:flex-start;flex:none;position:sticky;top:24px}
body.notes-on #summary{display:block;flex:none;width:340px;background:#fff;border:1px solid #DDE0E6;border-radius:12px;padding:22px 24px 20px;font-size:15px;line-height:23px;color:#111}
#summary h3{margin:0 0 16px;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#4B5563}
#summary .s-block{margin:0 0 20px;padding-top:16px;border-top:1px solid #E8EAEF}
#summary h4{margin:0 0 10px;font-size:13px;line-height:18px;font-weight:700}
#summary .s-what h4{color:var(--purple)}
#summary .s-why h4{color:#0B7A55}
#summary ul{margin:0;padding-left:20px}
#summary li{margin:0 0 9px;padding-left:2px}
#summary li:last-child{margin-bottom:0}
#summary .s-exp{margin:0 0 18px;padding-top:16px;border-top:1px solid #E8EAEF}
#summary .s-exp h4{margin:0 0 10px;font-size:15px;line-height:21px;color:#111}
#summary .s-exp p{margin:0 0 10px}
#summary .s-exp p:last-child{margin-bottom:0}
#summary .s-exp b{display:block;margin-bottom:2px;font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase}
#summary .s-h b{color:var(--purple)}
#summary .s-c b{color:#0B7A55}
#summary .s-empty{margin:0 0 18px;color:#4B5563}
#summary .s-note{margin:0;padding-top:14px;border-top:1px solid #E8EAEF;font-size:12px;line-height:17px;color:#6B7280}
body.notes-on .sheet,body.notes-on .backdrop{position:absolute}
body.notes-on #notes{display:block;flex:none;width:340px;background:#fff;border:1px solid #DDE0E6;border-radius:12px;padding:20px 22px 18px;font-size:14px;line-height:20px;color:#111}
@media (max-width:1360px){ body.notes-on #side{flex-direction:column} body.notes-on #summary{width:340px} }
body.notes-on #summary{display:none}
body.notes-on #side{flex:1 1 780px;max-width:900px;min-width:0}
body.notes-on:not(.shot) #stage{align-items:stretch}
body.notes-on:not(.shot) #side{position:static;align-items:stretch}
.n-exps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:0 0 4px}
body.notes-on #notes{width:100%;box-sizing:border-box}
.n-exp{display:grid;grid-template-columns:1fr;align-content:start;gap:6px;margin:0;padding:12px 14px;border-radius:8px;background:#F7F5FD;border:1px solid #E7E1F8}
.n-sw{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font:inherit;font-size:15px;line-height:20px;font-weight:700;text-align:left;color:#111;cursor:pointer}
.n-sw .dv-track{flex:none;background:#B8BCC6}
.n-sw[aria-checked=true] .dv-track{background:var(--purple)}
.n-sw[aria-checked=true] .dv-knob{left:19px}
.n-sw:focus-visible{outline:2px solid var(--purple);outline-offset:3px;border-radius:4px}
.n-exp.off>p{opacity:.55}
.n-child{grid-column:1/-1;margin-top:6px;padding-top:12px;border-top:1px dashed #D3CAEE;display:grid;gap:6px}
.n-child.off p{opacity:.55}
.n-child .n-idle{opacity:1;font-size:13px;line-height:18px;font-style:italic;color:#6B7280}
.n-child.idle .n-sw{opacity:.6;cursor:not-allowed}
.n-sw[disabled]{cursor:not-allowed}
.n-child p{margin:0}
.n-exp p{margin:0;font-size:14px;line-height:20px;color:#1F2937}
.n-exp i{display:block;margin-bottom:1px;font-style:normal;font-size:11px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.n-exp p+p i{color:#0B7A55}
.n-none{margin:0 0 14px;color:#4B5563}
.n-state{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0 0 16px;padding:10px 14px;border-radius:8px;font-size:14px;line-height:20px}
.n-state b{font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.n-state.live{background:#E8F7F1;border:1px solid #B5E3D0;color:#0B5F43}
.n-state.live::before{content:"";width:10px;height:10px;border-radius:50%;background:#0E9F6E;flex:none}
.n-state.redesign{background:#F1EBFE;border:1px solid #D8CBF8;color:#4a05b0}
.n-state.redesign span{flex:1 1 auto}
.n-state button{border:1px solid #4a05b0;background:#fff;color:#4a05b0;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.n-foot{margin:16px 0 0;font-size:12px;line-height:17px;color:#6B7280}
@media (max-width:780px){ body.notes-on #stage{flex-direction:column;align-items:center} body.notes-on #screen{flex:none;width:100%} body.notes-on #side{position:static;width:100%;max-width:640px} body.notes-on #notes,body.notes-on #summary{width:100%} }
.n-head{margin:0 0 2px;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--purple)}
#notes h2{margin:0 0 16px;font-size:20px;line-height:26px;font-weight:700}
.n-list{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.n-item{display:grid;grid-template-columns:24px 1fr;gap:10px}
.n-num{width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.n-item strong{display:block;font-size:14px;line-height:20px;font-weight:700}
.n-item ul{margin:4px 0 0;padding-left:18px}
.n-item ul li{margin:3px 0;color:#374151}
.n-item ul li b{color:#111}
.n-fx b{color:#0B7A55}
.n-data{margin:0 0 18px;padding:12px 14px;background:#F7F3FF;border:1px solid #E4D8FB;border-radius:8px;font-size:13.5px;line-height:20px;color:#111}
.n-data b{display:block;margin-bottom:2px;color:var(--purple);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.n-data p{margin:0}
.n-src{margin-top:8px!important;font-size:11.5px;line-height:16px;color:#6B7280}
.n-caveat{margin:16px 0 0;padding:10px 12px;background:#FFF8E6;border:1px solid #F3DFA2;border-radius:8px;font-size:13px;line-height:19px;color:#4B3B00}
.n-today{margin:0 0 18px;padding:10px 12px;background:#F7F3FF;border:1px solid #E4D8FB;border-radius:8px;font-size:14px;line-height:20px;color:#111}
.n-today span{display:block;margin-top:3px;font-size:11.5px;line-height:16px;color:#6B7280}
.n-sub{margin:0 0 4px;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#4B5563}
.c-list{margin:0;padding-left:20px;font-size:15px;line-height:22px;color:#111}
.c-list li{margin:10px 0}
.gain{display:block;margin-top:1px;font-size:13px;line-height:18px;font-weight:500;color:#0B7A55}
.n-measure{margin:18px 0 0;padding-top:14px;border-top:1px solid #E5E7EB;font-size:13px;line-height:19px;color:#4B5563}
.n-foot{margin:10px 0 0;font-size:12px;line-height:17px;color:#6B7280}
.dev-cap{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dev-toggle{flex:none;border:1px solid #666;background:#222;color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;cursor:pointer}
.dev-toggle[aria-pressed=true]{background:var(--purple);border-color:var(--purple);font-weight:700}

/* prototype navigator bar (never in screenshots) */
.dv-in{max-width:1100px;margin:0 auto;display:flex;gap:24px;align-items:stretch;justify-content:space-between}
.dv-main{flex:1 1 auto;min-width:0;display:grid;gap:10px}
.dv-row{display:flex;align-items:center;gap:12px}
.dv-label{flex:none;width:54px;font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#8A8F99}
.dv-steps,.dv-states{display:flex;gap:6px;flex-wrap:wrap}
.dv-step{display:flex;align-items:center;gap:8px;border:1px solid #444;background:#1f1f1f;color:#d1d5db;border-radius:8px;padding:7px 14px 7px 8px;font-size:13px;line-height:18px;font-weight:700;cursor:pointer}
.dv-step b{flex:none;width:20px;height:20px;border-radius:50%;background:#444;color:#fff;display:grid;place-items:center;font-size:11px}
.dv-step[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#111}
.dv-step[aria-pressed=true] b{background:#111;color:#fff}
.dv-state{border:1px solid #555;background:transparent;color:#d1d5db;border-radius:999px;padding:4px 12px;font-size:13px;line-height:18px;cursor:pointer}
.dv-state[aria-pressed=true]{background:#fff;border-color:#fff;color:#111;font-weight:700}
.dv-side{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:10px;padding-left:24px;border-left:1px solid #2c2c2c}
.dv-pager{display:flex;align-items:center;gap:10px;color:#c7cad1;font-size:12px;line-height:16px}
.dv-pager button{width:30px;height:30px;padding:0;border-radius:50%;border:1px solid #555;background:#1f1f1f;color:#fff;display:grid;place-items:center;cursor:pointer}
.dv-pager button[disabled]{opacity:.35;cursor:default}
.dv-pager .ic{width:20px;height:20px}
.dv-switch{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:#fff;font-size:13px;line-height:18px;font-weight:700;cursor:pointer}
.dv-track{position:relative;width:38px;height:22px;border-radius:11px;background:#555;transition:background .15s}
.dv-knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.dv-switch[aria-checked=true] .dv-track{background:var(--purple)}
.dv-switch[hidden]{display:none}
.dv-switch[aria-checked=true] .dv-knob{left:19px}
.dv-compare{flex:none;display:flex;align-items:center;padding-left:24px;border-left:1px solid #2c2c2c}
.dv-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:8px;background:#fff;color:#111;font-size:13px;line-height:18px;font-weight:700;text-decoration:none;white-space:nowrap}
.dv-btn:hover{background:#E5E7EB}
.dv-compare{gap:10px}
button.dv-btn{border:0;cursor:pointer;font-family:inherit}
.xpanel{position:fixed;left:10px;right:10px;bottom:150px;max-width:660px;margin:0 auto;max-height:62vh;overflow:auto;z-index:41;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:12px;padding:14px 16px 6px;box-shadow:0 8px 32px rgba(0,0,0,.45);font-size:13px;line-height:18px}
.xpanel[hidden]{display:none}
.xhead{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:6px}
.xhead b{font-size:15px}
.xhead span{flex:1 1 100%;color:#b8bcc6}
.xhead button{border:1px solid #555;background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.xstep{margin:14px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#8A8F99}
.xrow{padding:8px 0;border-top:1px solid #2c2c2c}
.xrow .dv-switch{font-size:14px;text-align:left}
.xrow p{margin:3px 0 0 48px;color:#b8bcc6}
.xrow p b{color:#fff}
.xrow p.xneeds{color:#8A8F99;font-style:italic}
@media (max-width:900px){ .dv-in{flex-direction:column;gap:10px} .dv-compare{border-left:0;padding-left:0} .dv-side{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;border-left:0;padding-left:0} }

.dev-step b{flex:none;width:18px;height:18px;border-radius:50%;background:#444;color:#fff;display:grid;place-items:center;font-size:11px}

.dev-states{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ============================== EXPERIMENTS ==============================
   Every change that could move drop-off on its own is a switch with the hypothesis it tests, so each can be A/B tested alone.
   Off = what the live site does. ?x=a,b turns exactly those on, ?x=none turns all off; no ?x uses the defaults below. */
const EXPERIMENTS=[
  {id:'addr-postcode-first',step:'address',on:false,name:'Postcode-first search and wording',
   short:"People stall on the open search box and on 'See more addresses', so a postcode box with one full list gets them to their address.",
   brief:"A Postcode box, one list of every address, and a clear 'Can't see your address?' button.",
   hypothesis:"People stall on the open 'Search for your address' box because they do not know what to type (a postcode, a street, a house number). Failed searches then lead to manual entry or leaving. Asking only for a postcode, in plain words, makes the first step obvious, a single list of every address removes the repeated 'See more addresses' clicking, and a clear button for a missing address beats a small link people miss.",
   control:"Headed 'Next, where do you live?' with one 'Search for your address' box that takes a postcode or a street name, and a small 'Manually enter address details' link under it. Results show five addresses at a time with a 'See more addresses' button.",
   variant:"Headed 'Next, what's your postcode?' with a Postcode box. The search starts by itself on a full postcode, with a Find address button as a backup. Every address is in one scrollable list with a count line ('15 addresses found'), and lists of more than eight also get a type-to-filter box. A clear 'Can't see your address? Enter it manually' button sits under the results, instead of the small link.",
   metric:"Address step completion; address_lookup_started, address_validation_error, address_manual_opened; position of the chosen address (address_selected); time on step; address_see_more (control only)."},
  {id:'addr-one-screen',step:'address',on:false,name:'Time at address on the same step',
   short:"Fewer screens means fewer chances to leave.",
   brief:"The question sits under the address instead of on a separate page.",
   hypothesis:"Too many questions across separate screens make this section feel long, and every extra screen is a chance to leave. Asking about time at the address on the address screen removes one page.",
   control:"Time at address is a separate page after the address.",
   variant:"Once an address is confirmed (or typed), the time-at-address question appears under it on the same step and the separate page is skipped.",
   metric:"Completion of the combined address and time-at-address section; total time through it."},
  {id:'addr-move-in-date',step:'address',on:false,parent:'addr-one-screen',name:"Ask 'When did you move in?', not 'How long?'",
   short:"A date is easier to answer than a duration, and the system does the maths.",
   brief:"'When did you move in?' with month and year; the system works out the length.",
   hypothesis:"'How long have you lived there?' makes people do sums in their head (years and months) and some get it wrong or give up. 'When did you move in?' is quicker and easier to answer, and the system works out the years and months it needs. The same wording can replace the other 'how long' questions (for example 'When did you start there?' for a job).",
   control:"'How long have you lived at this address?' with Years and Months boxes.",
   variant:"'When did you move in?' with Month and Year boxes. The system works out the length. Only applies when time at address is asked on the same step.",
   metric:"Completion and time on the time-at-address question; validation errors; people who enter a wrong length."},
  {id:'dob-single-box',step:'dob',on:false,name:'One date box that adds the slashes',
   short:"Three separate boxes are slow and fiddly on a phone; one box that adds the slashes cuts taps and format mistakes.",
   hypothesis:"Three separate boxes are slow and rigid on a phone, with a tap into each one and no help with the format. One box that adds the slashes, shows the rest of the date in grey and accepts pasting cuts taps and format mistakes.",
   control:"Three boxes (Day, Month, Year) that move on by themselves, with a tick in each when valid.",
   variant:"One box that adds the slashes as you type, shows the rest of the date in grey, pads a lone 4 to 04, and accepts pasting and autofill.",
   metric:"Step completion; time on step; dob_validation_error by type."},

  const pb=$('.progress'), cur=PAGES.findIndex(p=>p.k===key), n=pct(cur), cg=groupOf(cur);

const DOMAIN_FIX={'gmial.com':'gmail.com','gmai.com':'gmail.com','gamil.com':'gmail.com','gmil.com':'gmail.com','gmail.co':'gmail.com','gmail.con':'gmail.com','hotmial.com':'hotmail.com','hotmal.com':'hotmail.com','hotmail.con':'hotmail.com','yaho.com':'yahoo.com','yahooo.com':'yahoo.com','yahoo.con':'yahoo.com','outlok.com':'outlook.com','outlook.con':'outlook.com','icloud.co':'icloud.com','icloud.con':'icloud.com'};
const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
const stripPhone=v=>v.replace(/\(0\)/g,'').replace(/[\s\-().]/g,'');
const normPhone=v=>{ let p=stripPhone(v); if(p.indexOf('+44')===0)p='0'+p.slice(3); else if(p.indexOf('0044')===0)p='0'+p.slice(4); else if(/^440\d{10}$/.test(p)) p=p.slice(2); else if(/^44[1237]\d{9}$/.test(p)) p='0'+p.slice(2); else if(/^[1237]\d{9}$/.test(p)) p='0'+p;   /* 44 typed in front, or 10 digits typed without the leading 0 */ return p; };
const isIntl=v=>/^(\+|00)(?!44)\d{8,15}$/.test(stripPhone(v));   // a non-UK number, so nobody is locked out
const validPhone=v=>/^0[1237]\d{8,9}$/.test(normPhone(v))||isIntl(v);
const fmtPhone=v=>{ const p=normPhone(v); if(/^07\d{9}$/.test(p)) return p.replace(/^(07\d{3})(\d{6})$/,'$1 $2'); if(isIntl(v)) return v.trim().replace(/^00/,'+'); if(/^[1237]\d{9}$/.test(stripPhone(v))) return '0'+v.trim(); if(/^(\+44|0044|44)/.test(stripPhone(v))&&/^0[1237]\d{8,9}$/.test(p)) return p; return v.trim(); };
function emailSuggestion(v){
  v=v.trim(); const at=v.lastIndexOf('@'); if(at<1||!validEmail(v)) return null;
  const local=v.slice(0,at); let dom=v.slice(at+1).toLowerCase(); const orig=dom;
  if(DOMAIN_FIX[dom]) dom=DOMAIN_FIX[dom];
  dom=dom.replace(/\.(con|cmo|vom)$/,'.com').replace(/\.co\.k$/,'.co.uk');
  return dom!==orig? local+'@'+dom : null;
}

/* ============================== STEP 2: DATE OF BIRTH ============================== */
const ty=TODAY.getFullYear(), tm=TODAY.getMonth(), td=TODAY.getDate();
const MAXY=ty-18, MINY=ty-100;
const ageOn=(y,m,d)=>{ let a=ty-y; if(tm<m||(tm===m&&td<d)) a--; return a; };
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const DOBMSG={incomplete:'Enter your full date of birth',day:'Day must be between 1 and 31',month:'Month must be between 1 and 12',year:'Year must have four numbers, like 1990',future:'Your date of birth must be in the past',yearRange:'Please check the year. You need to be between 18 and 100 to apply.',tooOld:'Please check the year. That would make you over 100.'};
const fmtDate=dt=>dt.getDate()+' '+MONTHS[dt.getMonth()]+' '+dt.getFullYear();

function validateDob(d,m,y,mode,yy){
  const dn=+d, mn=+m, yn=+y;
  if(mode==='live'&&!(d&&m&&y.length===4)) return null;   // stay quiet until the date is complete
  if(mode==='submit'&&(!d||!m||!y)) return {field:!d?'day':!m?'month':'year',all:true,msg:DOBMSG.incomplete,type:'incomplete'};
  if(d&&(dn<1||dn>31)) return {field:'day',msg:DOBMSG.day,type:'day'};
  if(m&&(mn<1||mn>12)) return {field:'month',msg:DOBMSG.month,type:'month'};
  if(y&&y.length===2&&yy&&mode!=='live'&&![1900+yn,2000+yn].some(c=>c>=MINY&&c<=MAXY)) return {field:'year',msg:DOBMSG.yearRange,type:'yearRange'};   // 09 to 25: 2009 is too young, 1925 too old
  if(y&&y.length!==4&&mode!=='live') return {field:'year',msg:DOBMSG.year,type:'year'};
  if(!(d&&m&&y.length===4)) return null;
  const dt=new Date(yn,mn-1,dn);
  if(dt.getMonth()!==mn-1||dt.getDate()!==dn) return {all:true,msg:dn+' '+MONTHS[mn-1]+' '+y+' isn\'t a real date. Please check the day.',type:'notReal'};
  if(dt>TODAY) return {all:true,msg:DOBMSG.future,type:'future'};
  const age=ageOn(yn,mn-1,dn);
  if(age<18) return {all:true,msg:'You need to be 18 or over to apply. You\'ll be able to apply from '+fmtDate(new Date(yn+18,mn-1,dn))+'.',type:'under18'};
  if(age>100) return {field:'year',msg:DOBMSG.tooOld,type:'tooOld'};
  return {ok:true,age:age};
}

/* One masked box: "DD/MM/YYYY". Slashes are added as you type; a lone first digit that can't start a
   day (4 to 9) or month (2 to 9) is padded with a zero. */
const SEP='  /  ';   // what separates day, month and year in the box: room either side of each slash
function parseDob(raw,typing){
  const toks=raw.split(/[^0-9]+/);
  let d,m,y;
  if(toks.length===3&&toks[0].length===4){ y=toks[0]; m=toks[1]; d=toks[2]; }            // 1990-03-27 (browser autofill)
  else if(toks.length===1||toks[0].length>2||(toks.length>1&&toks[1].length>2)){          // digits only, or a paste with no separators
    const ds=raw.replace(/\D/g,''); let i=0;
    const take=first=>{ if(i>=ds.length) return ''; let s; if(+ds[i]>first){ s='0'+ds[i]; i+=1; } else { s=ds.slice(i,i+2); i+=s.length; } return s; };
    d=take(3); m=take(1); y=ds.slice(i,i+4);
  } else {
    const pad=(t,first,isLast)=>t.length===1&&(!isLast||(typing&&+t>first))?'0'+t:t;
    d=pad(toks[0]||'',3,toks.length===1); m=pad(toks[1]||'',1,toks.length===2); y=(toks[2]||'').slice(0,4);
  }
  return {d:d.slice(0,2),m:m.slice(0,2),y:y.slice(0,4)};
}
function renderDob(p,typing){
  let out=p.d;
  if(p.d.length===2&&(p.m.length||p.y.length||typing)) out+=SEP+p.m;
  if(p.m.length===2&&(p.y.length||typing)) out+=SEP+p.y;
  return out;
}

const UK_PC=/^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/i;
const LOOKUP_TIMEOUT=Number(qs.get('lt'))||10000;   // ms; ?lt=1500 shortens it for testing
const fmtPC=v=>{ const p=v.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); return UK_PC.test(p)?p.slice(0,-3)+' '+p.slice(-3):v.toUpperCase().trim(); };
const STREETS=[
  {street:'Factory Lane',items:[[1],[2],[3],[4],[5],[6],[7],[8,'Flat 1'],[8,'Flat 2']]},
  {street:'Morland Road',items:[[10],[12],[14],[16],[18,'Flat A'],[18,'Flat B']]}
];
function mockLookup(pc,instant){
  const key=pc.replace(/\s/g,'');
  const run=()=>{ if(key==='XX11XX') throw new Error('api'); if(key==='ZZ11ZZ') return []; let k=0;
    return STREETS.flatMap(s=>s.items.map(it=>({id:'a'+(++k),n:it[0],sub:it[1]||'',street:s.street,line1:(it[1]?it[1]+', ':'')+it[0]+' '+s.street,town:'Croydon',postcode:pc}))); };
  return new Promise((res,rej)=>{ const go=()=>{ try{res(run());}catch(e){rej(e);} }; if(key==='TM11ME') return;   /* TM1 1ME never answers: tests the timeout */ instant?go():setTimeout(go,550); });
}
const hl=(t,f)=>{ if(!f) return esc(t); const i=t.toLowerCase().indexOf(f.toLowerCase()); if(i<0) return esc(t); return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+f.length))+'</mark>'+esc(t.slice(i+f.length)); };

/* The time-at-address question. Date mode asks 'When did you move in?' (month and year, the system works out the length);
   otherwise the live 'How long have you lived at this address?' (years and months). */
function movedWidget(host,v,date,showLegend){
  const F=date?[{k:'a',id:'mv-a',label:'Month',ph:'MM',max:2},{k:'b',id:'mv-b',label:'Year',ph:'YYYY',max:4,year:true}]
              :[{k:'a',id:'mv-a',label:'Years',ph:'0',max:2},{k:'b',id:'mv-b',label:'Months',ph:'0',max:2}];
  const title=date?'When did you move in?':'How long have you lived at this address?';
  host.innerHTML='<fieldset class="moved"><legend'+(showLegend?'':' class="sr"')+'>'+title+'</legend><div class="mv-row">'+
    F.map(x=>'<div class="mv-f'+(x.year?' year':'')+'"><label for="'+x.id+'">'+x.label+'</label><input class="input" id="'+x.id+'" type="text" inputmode="numeric" maxlength="'+x.max+'" autocomplete="off" placeholder="'+x.ph+'" aria-describedby="mv-msg" value="'+esc(v[x.k])+'"></div>').join('')+
    '</div><div id="mv-msg" aria-live="polite"></div></fieldset>';
  const a=$('#mv-a',host), b=$('#mv-b',host), msg=$('#mv-msg',host), digits=el=>{ el.value=el.value.replace(/\D/g,''); };
  function error(final,bblur){
    if(date){
      const ty=TODAY.getFullYear(), tmo=TODAY.getMonth()+1;
      if(final&&v.a.length===1) v.a='0'+v.a;
      if(v.a.length===2&&(+v.a<1||+v.a>12)) return {f:'a',msg:'Month must be between 1 and 12'};
      if(v.b&&v.b.length!==4&&(final||bblur)) return {f:'b',msg:'Year must have four numbers, like 2019'};
      if(v.b.length===4){
        if(+v.b>ty||(+v.b===ty&&v.a.length===2&&+v.a>tmo)) return {f:'b',msg:'The date you moved in must be in the past'};
        if(+v.b<ty-100) return {f:'b',msg:'Please check the year'};
      }
      if(final){
        if(!v.a&&!v.b) return {f:'a',msg:'Enter the month and year you moved in'};
        if(!v.a) return {f:'a',msg:'Enter the month you moved in'};
        if(!v.b) return {f:'b',msg:'Enter the year you moved in'};
      }
    } else {
      if(v.b!==''&&+v.b>11) return {f:'b',msg:'Months must be between 0 and 11'};
      if(v.a!==''&&+v.a>99) return {f:'a',msg:'Please check the years'};
      if(final&&v.a===''&&v.b==='') return {f:'a',msg:'Enter how long you have lived at this address'};
    }
    return null;
  }
  function check(final,bblur){
    const e=error(final,bblur);
    if(final) a.value=v.a;
    a.classList.toggle('err',!!e&&e.f==='a'); b.classList.toggle('err',!!e&&e.f==='b');
    a.setAttribute('aria-invalid',String(!!e&&e.f==='a')); b.setAttribute('aria-invalid',String(!!e&&e.f==='b'));
    msg.innerHTML=e?errHTML(e.msg):'';
    if(e&&(final||bblur)) track('address_moved_validation_error');
    return e;
  }
  a.addEventListener('input',()=>{ digits(a); if(date&&a.value.length===1&&+a.value>1) a.value='0'+a.value; v.a=a.value; if(date&&a.value.length===2&&!error(false)) b.focus(); check(false); });
  b.addEventListener('input',()=>{ digits(b); v.b=b.value; check(false); });
  a.addEventListener('blur',()=>{ if(date&&a.value.length===1){ a.value='0'+a.value; v.a=a.value; } check(false); });
  b.addEventListener('blur',()=>{ if(b.value) check(false,true); });
  return {check:check};
}

function mockSearch(text,instant){
  // a postcode looks up its addresses; anything else is a street or address search across the sample addresses
  const clean=text.replace(/[^A-Za-z0-9]/g,'');

    if(S.selected){
      const a=S.selected;
      zone.innerHTML='<p class="confirm-sub" id="confirm-sub">Is this your address?</p><div class="card">'+ic('location','pin')+'<div class="adr"><b>'+esc(a.line1)+'</b><br>'+esc(a.town)+'<br>'+esc(a.postcode)+'</div><button type="button" class="link" id="change" aria-label="Change address">Change</button></div>';
      $('#change').addEventListener('click',()=>{ track('address_change_opened'); goManual(true); });   // straight to the form, filled in: often only one field needs editing
    } else if(S.manual){
      drawManual();
    } else drawSearch();
    drawMoved(); wireEnter(); updateCont();
  }

  /* --- search box: postcode only (variant) or the live 'address or street name' box (control) --- */
  function drawSearch(){
    zone.innerHTML=
    '<div class="field" id="pc-field"><label for="pc">'+(PF?'Postcode':'Search for your address')+'</label>'+
      '<div class="control"><input class="input" id="pc" type="text" '+(PF?'maxlength="14" autocomplete="postal-code" autocapitalize="characters"':'maxlength="80" autocomplete="off" autocapitalize="off"')+' enterkeyhint="search" spellcheck="false" placeholder="'+(PF?'e.g. CR0 3AG':'e.g. \'CR0 3AG\' or \'Factory Lane\'')+'" aria-describedby="pc-msg" value="'+esc(S.postcode)+'"><span class="spinner" id="pc-spin" role="status" aria-label="Finding addresses…" hidden></span></div>'+
      '<div id="pc-msg" aria-live="polite"></div></div>'+
    (PF?'<button type="button" class="btn secondary" id="find">Find address</button>':'')+
    (CSB?'':'<button type="button" class="link manual" data-manual>Manually enter address details</button>')+
    '<div id="results"></div>';
    const pc=$('#pc');
    pc.addEventListener('input',()=>{
      S.postcode=PF?pc.value.toUpperCase():pc.value; if(PF) pc.value=S.postcode;
      clearTimeout(timer); seq++;
      if(S.status!=='idle'){ S.status='idle'; S.list=[]; S.filter=''; S.active=null; S.shown=PAGE; paint(); }
      if(PF?looksPc(S.postcode):S.postcode.trim().length>=3) timer=setTimeout(()=>lookup('auto'),400);
    });
    pc.addEventListener('blur',()=>{ if(!looksPc(pc.value)) return; const f=fmtPC(pc.value); if(f!==pc.value){ pc.value=f; S.postcode=f; } });
    pc.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); clearTimeout(timer); lookup('button'); } });
    const find=$('#find'); if(find) find.addEventListener('click',()=>{ clearTimeout(timer); lookup('button'); });
    paint();
  }
  function lookup(source,instant){
    if(S.status==='loading') return;
    const txt=S.postcode.trim();
    if(!txt||(PF?!looksPc(txt):txt.length<3&&!looksPc(txt))){ S.status='invalid'; return paint(); }
    S.isPc=looksPc(txt);
    if(S.isPc){ S.postcode=fmtPC(S.postcode); const el=$('#pc'); if(el) el.value=S.postcode; }   // tidy what was typed or pasted
    const my=++seq; S.status='loading'; paint(); track('address_lookup_started',{source:source});
    // never leave a spinner running: after LOOKUP_TIMEOUT fall back to the manual route
    const to=setTimeout(()=>{ if(my===seq&&S.status==='loading'){ seq++; S.status='error'; paint(); track('address_lookup_timeout'); } },LOOKUP_TIMEOUT);
    return mockSearch(S.postcode,instant).then(list=>{
      clearTimeout(to); if(my!==seq) return;
      S.list=list; S.status=list.length?'results':'empty'; S.filter=''; S.active=null; S.shown=PAGE;
      if(list.length===1){ S.selected=list[0]; drawZone(); track('address_selected',{position:1}); return; }
      paint();
      if(list.length){ track('address_results_shown',{count:list.length}); const c=$('#count'); if(c&&!instant) c.focus(); }
    }).catch(()=>{ clearTimeout(to); if(my!==seq) return; S.status='error'; paint(); });
  }
  function paint(){
    const pc=$('#pc'); if(!pc) return;
    const msg=$('#pc-msg'), find=$('#find'), res=$('#results');
    $('#pc-spin').hidden=S.status!=='loading';
    if(find){ find.hidden=S.status==='results'; find.disabled=S.status==='loading'; }
    pc.classList.toggle('err',S.status==='invalid'||S.status==='empty'||S.status==='error');
    pc.setAttribute('aria-invalid',pc.classList.contains('err')?'true':'false');
    let m='';
    if(S.status==='invalid') m=errHTML(PF?(S.postcode.trim()?'Enter a full UK postcode, like CR0 3AG':'Enter your postcode'):'Enter your postcode or street name');
    if(S.status==='empty') m=errHTML('We couldn\'t find any addresses for '+qlabel()+'. '+(S.isPc?'Check the postcode':'Check what you typed')+', or enter your address manually.')+(CSB?'<button type="button" class="link manual" data-manual>Enter your address manually</button>':'');
    if(S.status==='error') m=errHTML('Our address finder isn\'t working right now. Please enter your address manually.')+(CSB?'<div style="margin-top:16px"><button type="button" class="btn secondary" data-manual>Enter address manually</button></div>':'');
    msg.innerHTML=m;
    if(S.status==='invalid') track('address_validation_error');
    if(S.status==='results') drawResults(); else res.innerHTML='';
    updateCont();
  }

  /* --- results: one scroll container (single list) or five at a time (live) --- */
  function drawResults(){
    const res=$('#results'), many=S.list.length>8;
    res.innerHTML=
      '<p class="count'+(ONE?'':' sr')+'" id="count" tabindex="-1" aria-live="polite"></p>'+
      (FLT&&many?'<div class="control filter">'+ic('search')+'<input class="input" id="flt" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your house number or name" aria-label="Filter addresses" aria-controls="lb" value="'+esc(S.filter)+'"></div>':'')+
      '<div class="lbwrap'+(ONE?'':' paged')+'" id="lbwrap"><div class="lb" id="lb" role="listbox" tabindex="0" aria-label="Addresses for '+esc(qlabel())+'"></div></div>'+
      '<p class="nomatch" id="nomatch" hidden></p>'+
      (ONE?'':'<button type="button" class="btn secondary more" id="more">See more addresses</button>')+
      (CSB?'<button type="button" class="btn secondary cant" data-manual>Can\'t see your address? Enter it manually</button>':'')+
      '<div id="sel-msg" aria-live="polite"></div>';
    const lb=$('#lb'), flt=$('#flt'), more=$('#more');
    lb.addEventListener('scroll',atEnd);
    lb.addEventListener('click',e=>{ const o=e.target.closest('.opt'); if(o) choose(o.dataset.id); });
    lb.addEventListener('keydown',e=>{
      const items=visible(); if(!items.length) return;
      let i=items.findIndex(a=>a.id===S.active);
      if(e.key==='ArrowDown'){ e.preventDefault(); i=Math.min(items.length-1,i+1); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); i=Math.max(0,i<0?0:i-1); }
      else if(e.key==='Home'){ e.preventDefault(); i=0; }
      else if(e.key==='End'){ e.preventDefault(); i=items.length-1; }
      else if(e.key==='Enter'){ if(i>-1){ e.preventDefault(); choose(items[i].id); } return; }
      else if(e.key==='Escape'){ if(flt){ e.preventDefault(); flt.focus(); } return; }
      else return;
      setActive(items[i].id);
    });
    if(flt){
      flt.addEventListener('input',()=>{ S.filter=flt.value; S.active=null; drawList(); if(S.filter.trim()) track('address_filter_used'); });
      flt.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){ e.preventDefault(); const it=visible()[0]; lb.focus(); if(it) setActive(it.id); } if(e.key==='Enter') e.preventDefault(); });
    }
    if(more) more.addEventListener('click',()=>{ S.shown+=PAGE; track('address_see_more',{shown:S.shown}); drawList(); });
    drawList();
  }
  function setActive(id){
    S.active=id; $$('.opt',$('#lb')).forEach(o=>o.setAttribute('aria-selected',String(o.dataset.id===id)));
    $('#lb').setAttribute('aria-activedescendant','o-'+id);
    const el=$('#o-'+id); if(el) el.scrollIntoView({block:'nearest'});
  }
  function atEnd(){ const lb=$('#lb'); if(!lb) return; $('#lbwrap').classList.toggle('at-end',lb.scrollTop+lb.clientHeight>=lb.scrollHeight-4); }
  function drawList(){
    const g=filtered(), lb=$('#lb'), f=FLT?S.filter.trim():'', total=S.list.length, items=ONE?g.items:g.items.slice(0,S.shown);
    $('#count').textContent=f?('Showing '+g.items.length+' of '+total+' addresses'):(total+(total===1?' address':' addresses')+' found for '+qlabel());
    const opt=a=>'<div class="opt" role="option" id="o-'+a.id+'" data-id="'+a.id+'" aria-selected="'+(a.id===S.active)+'"><span>'+hl(a.line1,f)+'</span></div>';
    lb.innerHTML=items.map(opt).join('');
    lb.removeAttribute('aria-activedescendant');
    const nm=$('#nomatch'); nm.hidden=g.items.length>0; $('#lbwrap').hidden=g.items.length===0;
    if(!g.items.length) nm.textContent='No addresses match "'+S.filter+'". Check the number, or enter your address manually.';
    const more=$('#more'); if(more) more.hidden=g.items.length<=S.shown;
    lb.scrollTop=0; atEnd();
  }
  function choose(id){
    S.selected=S.list.find(a=>a.id===id); S.manual=false; $('#cont-msg').innerHTML='';
    track('address_selected',{position:S.list.indexOf(S.selected)+1});
    drawZone(); const mv=$('#mv-a'); (mv||cont).focus();
  }
  function goManual(fromSelected){
    track('address_manual_opened',{reason:fromSelected?'change_address':S.status==='error'?'lookup_error':S.status==='empty'?'no_results':'user'});
    if(fromSelected&&S.selected){ const a=S.selected; S.man={n:(a.sub?a.sub+', ':'')+a.n,street:a.street,town:a.town,pc:a.postcode}; }   // the chosen address, ready to edit
    else if(S.isPc) S.man.pc=S.postcode;
    S.manual=true; S.selected=null; drawZone(); const n=$('#man-n'); if(n) n.focus();
  }

  /* --- manual entry --- */
  function drawManual(){
    const F=[['n','Flat, house name or number','man-n','address-line1','Enter your flat, house name or number'],['street','Street','man-street','address-line2','Enter your street'],['town','Town or city','man-town','address-level2','Enter your town or city'],['pc','Postcode','man-pc','postal-code','Enter a full UK postcode, like CR0 3AG']];
    zone.innerHTML=F.map(f=>'<div class="field"><label for="'+f[2]+'">'+f[1]+'</label><div class="control"><input class="input" id="'+f[2]+'" data-k="'+f[0]+'" type="text" autocomplete="'+f[3]+'" value="'+esc(S.man[f[0]])+'"'+(f[0]==='pc'?' maxlength="14" autocapitalize="characters"':'')+'></div><div id="'+f[2]+'-msg" aria-live="polite"></div></div>').join('')+
      '<button type="button" class="link switch" id="to-search">'+(PF?'Search by postcode instead':'Search for your address instead')+'</button>';
    $$('input',zone).forEach(i=>i.addEventListener('input',()=>{ S.man[i.dataset.k]=i.dataset.k==='pc'?i.value.toUpperCase():i.value; if(i.dataset.k==='pc') i.value=S.man.pc; if(i.classList.contains('err')) manualCheck(i,F); }));
    $('#to-search').addEventListener('click',()=>{ S.manual=false; drawZone(); const p=$('#pc'); if(p) p.focus(); });
    zone._F=F;
  }
  function manualCheck(inp,F){
    const f=F.find(x=>x[2]===inp.id), v=S.man[f[0]].trim();
    const bad=f[0]==='pc'?!UK_PC.test(v.replace(/\s/g,'')):!v;
    inp.classList.toggle('err',bad); inp.setAttribute('aria-invalid',bad?'true':'false');
    $('#'+inp.id+'-msg').innerHTML=bad?errHTML(f[4]):'';
    return !bad;
  }

  /* --- optional: the time-at-address question on the same step (addr-one-screen) --- */
  let MVW=null;
  function drawMoved(){
    const el=$('#moved');
    if(!MOV||!(S.selected||S.manual)){ el.innerHTML=''; MVW=null; return; }
    MVW=movedWidget(el,S.mv,MDATE,true);
  }
  const movedCheck=final=>MVW?MVW.check(final):null;
  // switching the wording on or off redraws just this question (its boxes mean something different, so they start empty); the rest of the step stays as it is
  liveHooks['addr-move-in-date']=()=>{ MDATE=xOn('addr-move-in-date'); S.mv={a:'',b:''}; if(MOV) drawMoved(); };

  /* --- the keyboard's Enter key goes to the next field, and submits on the last one --- */
  function wireEnter(){
    const ins=$$('#zone input[data-k], #moved input');
    ins.forEach((el,i)=>{
      el.enterKeyHint=i<ins.length-1?'next':'go';
      el.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; e.preventDefault(); if(i<ins.length-1) ins[i+1].focus(); else $('#f').requestSubmit(); });
    });
  }

  $('#f').addEventListener('submit',e=>{
    e.preventDefault();
    if(!S.selected&&!S.manual){ $('#cont-msg').innerHTML='<div style="margin-bottom:16px">'+errHTML('Choose your address from the list to continue')+'</div>'; const t=$('#lb'); if(t) t.focus(); return; }
    if(S.manual){ const F=zone._F; let first=null; F.forEach(f=>{ const i=$('#'+f[2]); if(!manualCheck(i,F)&&!first) first=i; }); if(first){ first.focus(); if(MOV) movedCheck(true); return; } }
    if(MOV){ const err=movedCheck(true); if(err){ $('#mv-'+err.f).focus(); return; } track('address_moved_in_entered'); }
    if(MOV) note('Prototype: this goes to the next step.'); else location.hash='#/address/time';   // the separate time-at-address page
  });

  /* --- presets for screenshots --- */
  drawZone();
  if(preset.postcode){ S.postcode=preset.postcode; $('#pc').value=preset.postcode; }
  // the lookup is async even when instant, so apply the rest of the preset once it has resolved
  Promise.resolve(preset.lookup?lookup('button',true):null).then(()=>{
    if(preset.filter&&FLT){ S.filter=preset.filter; const fl=$('#flt'); if(fl) fl.value=preset.filter; drawList(); }
    if(preset.select){ S.selected=S.list.find(a=>a.line1===preset.select); drawZone(); }
    if(preset.manual){ goManual(false); }
  });
}

function paintNotes(k){
  document.body.classList.toggle('notes-on',notesOn); document.body.classList.toggle('shot',SHOT);
  const pins=$('#pins'), panel=$('#notes'); pins.innerHTML=''; panel.innerHTML=''; $('#summary').innerHTML='';
  if(!notesOn) return;
  const step=k.split('/')[0], exps=EXPERIMENTS.filter(e=>e.step===step), on=exps.filter(e=>xOn(e.id));
  // lines that belong to an experiment are covered by its block; the rest are changes that need no test
  const plain=(CHANGES[k]||[]).filter(p=>!p[2]&&(dobHelp||!/^Example shown|confirms the date/.test(p[0])));
  panel.innerHTML='<p class="n-head">'+STEP_TITLES[step]+'</p><h2>'+esc(STATE_LABELS[k]||k)+'</h2>'+
    (exps.length?(on.length||xOn('global-stepper')?'<div class="n-state redesign"><b>Redesign</b><span>'+(on.length?on.length+' of '+exps.length+' changes switched on'+(xOn('global-stepper')?', plus the progress stepper.':'.'):'The progress stepper is switched on.')+'</span><button type="button" data-xoff="1">Show the live version</button></div>':'<div class="n-state live"><b>Current live version</b><span>All switches are off, so this is what customers see today.</span></div>'):'')+
    (exps.length?'<p class="n-sub">Hypotheses</p><div class="n-exps">'+exps.filter(e=>!e.parent).map(e=>{ const sw=(x,cls)=>'<div class="'+cls+(X[x.id]?'':' off')+(x.parent&&!X[x.parent]?' idle':'')+'"><button type="button" class="n-sw" role="switch" data-x="'+x.id+'" aria-checked="'+!!X[x.id]+'"'+(x.parent&&!X[x.parent]?' disabled aria-disabled="true"':'')+'><span class="dv-track"><span class="dv-knob"></span></span>'+esc(x.name)+'</button><p>'+esc(x.short)+'</p>'+(x.parent&&!X[x.parent]?'<p class="n-idle">Switch on "'+esc(EXPERIMENTS.find(p=>p.id===x.parent).name)+'" first to use this.</p>':'')+'</div>'; return '<div class="n-exp'+(X[e.id]?'':' off')+'"><button type="button" class="n-sw" role="switch" data-x="'+e.id+'" aria-checked="'+!!X[e.id]+'"><span class="dv-track"><span class="dv-knob"></span></span>'+esc(e.name)+'</button><p>'+esc(e.short)+'</p>'+exps.filter(c=>c.parent===e.id).map(c=>sw(c,'n-child')).join('')+'</div>'; }).join('')+'</div>':'')+

  'address/time':()=>mountTimeAtAddress(),
  'dob/default':()=>mountDob(),
  'dob/picker-year':force(['dob-calendar'],()=>mountDob({picker:{y:null,m:null,d:null,view:'year'}})),
  'dob/picker-day':force(['dob-calendar'],()=>mountDob({picker:{y:2000,m:9,d:10,view:'day'}})),
  'dob/valid':()=>mountDob({values:['10','10','2000']}),
  'dob/under18':()=>mountDob({values:['10','10','2010']}),
  'contact/default':()=>mountContact(),
  'contact/errors':()=>mountContact({email:'alex.smith@example',phone:'07700 9001'}),
  'contact/suggestion':force(['contact-email-suggestion'],()=>mountContact({email:'alex.smith@gmial.com',phone:'07700 900123'})),
  'contact/submitting':()=>mountContact({email:'alex.smith@gmail.com',phone:'07700 900123',submitting:true,hold:true})
};
function route(){
  liveHooks={};
  const old=$('.backdrop'); if(old) old.remove(); const os=$('.sheet'); if(os) os.remove(); app.inert=false;
  const k=(location.hash||'#/address/default').replace(/^#\//,''); const fn=ROUTES[k]||ROUTES['address/default'];
  fn(); window.scrollTo(0,0); paintDev(ROUTES[k]?k:'address/default'); lastKey=ROUTES[k]?k:'address/default'; paintNotes(lastKey);
  // screenshots should not show a stray focus ring left by a preset
  if(SHOT) setTimeout(()=>{ const a=document.activeElement; if(a&&a!==document.body&&a.blur) a.blur(); },50);
}
/* prototype navigator: three steps, each with its own states (hidden when ?shot=1) */
const STEPS=[
  {key:'address',n:1,label:'Address'},
  {key:'dob',n:2,label:'Date of birth'},
  {key:'contact',n:3,label:'Contact details'}
];
const STATE_LABELS={
  'address/default':'Postcode','address/results':'Results','address/filtered':'Filtered','address/selected':'Selected','address/manual':'Manual entry','address/error':'Error','address/moved':'Same step','address/time':'Time at address',
  'dob/default':'Empty','dob/picker-year':'Calendar: year','dob/picker-day':'Calendar: day','dob/valid':'Valid','dob/under18':'Under 18',
  'contact/default':'Default','contact/errors':'Errors','contact/suggestion':'Email suggestion','contact/submitting':'Submitting'
};
let dev=null;
const ORDER=Object.keys(ROUTES);
function paintDev(cur){
  if(!dev) return;
  const sb=dev.querySelector('#dev-stepper'); if(sb) sb.setAttribute('aria-checked',String(xOn('global-stepper')));
  const step=cur.split('/')[0], idx=ORDER.indexOf(cur);
  dev.querySelector('.dv-steps').innerHTML=STEPS.map(s=>'<button type="button" class="dv-step" data-go="'+s.key+'/default" aria-pressed="'+(s.key===step)+'"><b>'+s.n+'</b><span>'+s.label+'</span></button>').join('');
}
if(!SHOT){
  dev=document.createElement('div'); dev.className='dev';
  dev.innerHTML=
   '<div class="dv-in">'+
     '<div class="dv-main">'+
       '<div class="dv-row"><span class="dv-label">Step</span><div class="dv-steps"></div></div>'+
     '</div>'+
     '<div class="dv-side"><button type="button" class="dv-switch" id="dev-stepper" role="switch" aria-checked="false"><span class="dv-track"><span class="dv-knob"></span></span>Four-stage progress stepper (all steps)</button></div>'+
     '<div class="dv-compare"><a class="dv-btn" href="compare.html">Compare with current</a></div>'+
   '</div>';
  document.body.appendChild(dev); document.body.classList.add('has-dev');
  dev.addEventListener('click',e=>{
    const g=e.target.closest('[data-go]'); if(g){ location.hash='#/'+g.dataset.go; return; }
  });
}
window.addEventListener('hashchange',route);
if(dev) $('#dev-stepper').addEventListener('click',()=>{ X['global-stepper']=!X['global-stepper']; syncX(); $('#dev-stepper').setAttribute('aria-checked',String(xOn('global-stepper'))); if(progKey) setProgress(progKey); paintNotes(lastKey); });
$('#notes').addEventListener('click',e=>{ const off=e.target.closest('[data-xoff]'); if(off){ const y0=window.scrollY; const st=(location.hash.replace(/^#\//,'').split('/')[0]); EXPERIMENTS.forEach(x=>{ if(x.step===st||x.step==='all') X[x.id]=false; }); syncX(); route(); window.scrollTo(0,y0); return; } const t=e.target.closest('[data-x]'); if(!t) return; const y=window.scrollY; if(t.disabled) return; const id=t.dataset.x; X[id]=!X[id]; if(!X[id]) EXPERIMENTS.forEach(c=>{ if(c.parent===id) X[c.id]=false; }); syncX(); if(liveHooks[id]){ liveHooks[id](); paintNotes(lastKey); } else { route(); window.scrollTo(0,y); } });
route();
})();
</script>
</body>
